
        <form (ngSubmit)="guardar()" class="form">
          <h1>Lista de Empleados</h1>
          <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Nombre"/>
          <input type="text" [(ngModel)]="apellido" name="apellido" placeholder="Apellido"/>
          <input type="email" [(ngModel)]="email" name="email" placeholder="Agregar email"/>
          <input type="number" [(ngModel)]="salario" name="salario" placeholder="Agregar salario"/>
          <button type="button" name="add" (click)="guardar()" class="add">Agregar</button>
        </form>

        <table class="table">
          <thead>
            <tr>
            <th>nombre</th>
            <th>apellido</th>
            <th>email</th>
            <th>salario</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor ="let p of empleados">

              <td>{{p.nombre}}</td>
              <td>{{p.apellido}}</td>
              <td>{{p.email}}</td>
              <td>{{p.salario}}</td>

            </tr>
          </tbody>

        </table>
